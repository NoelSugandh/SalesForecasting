<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href='https://fonts.googleapis.com/css?family=Open+Sans' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_about.css') }}">
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <ul class="flashes">
            {% for category, message in messages %}
                <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
   {% endwith %}

    <header>
        <div class="header-content">
            <div class="menu-toggle" id="menuToggle" onclick="toggleMenu()">&#9776;</div>
            <div class="logo"><a href="/home">Sales Forecasting</a></div>
        </div>
    </header>

    <div class="side-tab" id="sideTab">
        <nav>
            <ul>
                <li><a href="/home">Home</a></li>
                <li><a href="/profile">Profiles</a></li>
                <li><a href="/how_to_use">How to Use</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/contact">Contact Us</a></li>
                <li><a href="/">Logout</a></li>
            </ul>
        </nav>
    </div>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <div class="content">
        <h1>Contact Us</h1>
        <form action="{{ url_for('contact') }}" method="POST">
            <input type="text" name="name" placeholder="Your Name" required />
            <input type="email" name="email" placeholder="Your Email" required />
            <textarea name="message" placeholder="Your Message" required></textarea>
            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </div>

    <script>
        function toggleMenu() {
            const sideTab = document.getElementById('sideTab');
            const overlay = document.getElementById('overlay');
            const menuToggle = document.getElementById('menuToggle');

            sideTab.classList.toggle('active');
            overlay.classList.toggle('active');

            if (sideTab.classList.contains('active')) {
                menuToggle.innerHTML = '&#10005;'; // Change to X
            } else {
                menuToggle.innerHTML = '&#9776;'; // Change back to hamburger
            }
        }

        function closeMenu() {
            const sideTab = document.getElementById('sideTab');
            const overlay = document.getElementById('overlay');
            const menuToggle = document.getElementById('menuToggle');

            sideTab.classList.remove('active');
            overlay.classList.remove('active');
            menuToggle.innerHTML = '&#9776;'; // Change back to hamburger
        }
        setTimeout(function() {
            const flashes = document.querySelectorAll('.flashes li');
            flashes.forEach(function(flash) {
                flash.style.opacity = 0;  // Fade out
                flash.style.transform = 'translateY(-10px)';
            });
        }, 3000);

    </script>
</body>
</html>
