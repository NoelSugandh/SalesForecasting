<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul class="flashes">
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <div id="container">
        <!-- Registration Form -->
        <div id="registrationFormContainer">
            <form id="registrationForm" action="/register" method="POST">
                <h2>Registration</h2>
                <input type="text" name="fullName" placeholder="Full Name" required>
                <input type="text" name="username" placeholder="Username" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
                <input type="tel" name="phoneNumber" placeholder="Phone Number" required>
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
                <label><input type="checkbox" name="agreeTerms" required> Agree to <a href="/terms_conditions">Terms and Conditions</a></label>

                <button type="submit">Register</button>
            </form>
            <p>Already have an account? <a href="/">Login</a></p>
        </div>
    </div>
 <script>
    // Automatically hide flash messages after 3 seconds
    setTimeout(function() {
        const flashes = document.querySelectorAll('.flashes li');
        flashes.forEach(function(flash) {
            flash.style.opacity = 0;  // Fade out the flash message
            flash.style.transform = 'translateY(-10px)';
        });
    }, 3000);  // 3 seconds
</script>

</body>
</html>
