<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_fp.css') }}">
</head>
<body>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul class="flashes">
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <div id="container">
        <!-- Login Form -->
        <div id="forgotPasswordFormContainer" class="forgotPasswordFormContainer">
            <form id="resetForm" action="/forgot_password" method="post">
                <h2>Forgot Password</h2>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
                <button type="submit">Send Reset Link</button>
            </form>
        </div>
    </div>
    <p><a href="/">Back to Login</a></p>
    <script>
        // Automatically hide flash messages after 3 seconds
        setTimeout(function() {
            const flashes = document.querySelectorAll('.flashes li');
            flashes.forEach(function(flash) {
                flash.style.opacity = 0;  // Fade out the flash message
                flash.style.transform = 'translateY(-10px)';
            });
        }, 3000);

        if (window.location.pathname === "/forgot_password") {
            // Disable the back button behavior if user is on forgot password page
            window.history.pushState(null, null, window.location.href);
            window.onpopstate = function() {
                // Allow users to go back to the login page if they are coming from there
                if (document.referrer.includes("/login")) {
                    window.history.back();  // Go back to the login page
                } else {
                    window.history.pushState(null, null, window.location.href);  // Stay on forgot password page
                }
            };
        }
    </script>

</body>
</html>
