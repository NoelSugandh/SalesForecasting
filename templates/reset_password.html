<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_rp.css') }}">
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul class="flashes">
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <div id="container">
        <div id="resetPasswordFormContainer">
            <form method="POST" action="/reset_password/{{ token }}" onsubmit="return validatePassword()">
                <h2>Reset Your Password</h2>

                <div class="input-group">
                    <input type="password" id="new_password" name="new_password" required placeholder="Enter new password">
                </div>

                <div class="input-group">
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm your password">
                </div>

                <button type="submit">Reset Password</button>
            </form>
        </div>
    </div>

    <script>
        // Automatically hide flash messages after 3 seconds
        setTimeout(function() {
            const flashes = document.querySelectorAll('.flashes li');
            flashes.forEach(function(flash) {
                flash.style.opacity = 0;  // Fade out the flash message
                flash.style.transform = 'translateY(-10px)';
            });
        }, 3000);

        if (window.location.pathname === "/forgot_password") {
            // Disable the back button behavior if user is on forgot password page
            window.history.pushState(null, null, window.location.href);
            window.onpopstate = function() {
                // Allow users to go back to the login page if they are coming from there
                if (document.referrer.includes("/login")) {
                    window.history.back();  // Go back to the login page
                } else {
                    window.history.pushState(null, null, window.location.href);  // Stay on forgot password page
                }
            };
        }
    </script>
</body>
</html>
